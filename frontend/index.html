<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#F5F7FB">
    <meta name="description" content="uShape วิเคราะห์รูปหน้าด้วย AI ลองทรงผมและแว่นเสมือนจริง แล้วจองคิวช่างใกล้คุณ">
    <title>uShape · วิเคราะห์รูปหน้า ลองทรงผม จองช่าง</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24'%3E%3Crect width='24' height='24' rx='7' fill='%233E5C9A'/%3E%3Cpath d='M7.5 7v4.5a4.5 4.5 0 0 0 9 0V7' fill='none' stroke='white' stroke-width='2.2' stroke-linecap='round'/%3E%3C/svg%3E">
    <script>
        // Static-server development has no Nginx /api reverse proxy.
        if (!window.__API_BASE_URL__ &&
            ["localhost", "127.0.0.1"].includes(window.location.hostname) &&
            window.location.port === "5173") {
            window.__API_BASE_URL__ = "http://localhost:8000";
        }
        // GitHub Pages: เรียก backend บน Render
        if (!window.__API_BASE_URL__ && window.location.hostname.endsWith("github.io")) {
            window.__API_BASE_URL__ = "https://appuface.onrender.com";
        }
    </script>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ["IBM Plex Sans Thai", "system-ui", "sans-serif"],
                        display: ["Noto Serif Thai", "Georgia", "serif"],
                    },
                },
            },
        };
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Thai:wght@400;500;600;700&family=Noto+Serif+Thai:wght@500;600;700&display=swap" rel="stylesheet">
    <!-- MediaPipe Face Mesh: real 468-point facial landmark tracking used by the
         Golden Ratio, Virtual Glasses and Virtual Hairstyle AR modules -->
    <!-- MediaPipe: only Tasks Vision (js/mediapipeTasks.js). Don't add the old @mediapipe/face_mesh script back:
         both builds share the global WASM `Module` and loading one after the other crashes the hair try-on. -->
    <link rel="stylesheet" href="css/style.css?v=20261114">
</head>
<body class="min-h-screen">
    <a href="#main-content" class="skip-link">ข้ามไปเนื้อหาหลัก</a>

    <!-- Brand mark: a "U" jawline with a spark — face shape + style -->
    <svg width="0" height="0" class="absolute" aria-hidden="true">
        <symbol id="logo-mark" viewBox="0 0 24 24">
            <path d="M6.5 6v5.5a5.5 5.5 0 0 0 11 0V6" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round"/>
            <circle cx="10" cy="10.5" r="1.1" fill="currentColor"/><circle cx="14" cy="10.5" r="1.1" fill="currentColor"/>
            <path d="M19.6 2.4l.5 1.3 1.3.5-1.3.5-.5 1.3-.5-1.3-1.3-.5 1.3-.5z" fill="currentColor"/>
        </symbol>
    </svg>

    <div data-include="pages/login.html"></div>

    <!-- ============ APP CONTENT ============ -->
    <div id="app-content" class="hidden min-h-screen flex flex-col md:flex-row">

        <!-- Mobile top bar -->
        <div id="mobile-topbar">
            <button type="button" class="brand brand-home" onclick="goHome()" aria-label="กลับหน้าแรก">
                <span class="brand-mark !w-8 !h-8 !rounded-[10px]"><svg class="!w-5 !h-5"><use href="#logo-mark"/></svg></span>
                <span class="brand-name !text-lg">uShape</span>
            </button>
            <button onclick="openMobileMenu()" aria-label="เปิดเมนูและบัญชี" class="user-avatar !w-9 !h-9" data-user-initial>U</button>
        </div>

        <!-- Overlay for mobile drawer -->
        <div id="sidebar-overlay" onclick="closeMobileMenu()"></div>

        <aside id="sidebar" aria-label="เมนูหลัก">
            <div class="h-[72px] px-6 flex items-center justify-between">
                <div class="brand">
                    <span class="brand-mark"><svg><use href="#logo-mark"/></svg></span>
                    <span class="brand-name">uShape</span>
                </div>
                <button onclick="closeMobileMenu()" aria-label="ปิดเมนู" class="md:hidden icon-btn icon-btn-plain">
                    <i class="fa-solid fa-xmark"></i>
                </button>
            </div>

            <nav class="nav">
                <div class="nav-group">
                    <span class="nav-label">สำรวจ</span>
                    <button onclick="navigateTo('screen-main')" id="nav-main" class="nav-item is-active"><i class="fa-solid fa-house"></i>หน้าแรก</button>
                    <button onclick="navigateTo('screen-guide')" id="nav-guide" class="nav-item"><i class="fa-regular fa-lightbulb"></i>คู่มือรูปหน้า</button>
                    <button onclick="navigateTo('screen-golden')" id="nav-golden" class="nav-item"><i class="fa-solid fa-ruler-combined"></i>วัดสัดส่วนใบหน้า</button>
                </div>
                <div class="nav-group">
                    <span class="nav-label">ลองลุคใหม่</span>
                    <button onclick="navigateTo('screen-hairstyle')" id="nav-hairstyle" class="nav-item"><i class="fa-solid fa-scissors"></i>ลองทรงผม</button>
                    <button onclick="navigateTo('screen-glasses')" id="nav-glasses" class="nav-item"><i class="fa-solid fa-glasses"></i>ลองแว่นตา</button>
                </div>
                <div class="nav-group">
                    <span class="nav-label">ช่างและร้าน</span>
                    <button onclick="navigateTo('screen-booking')" id="nav-booking" class="nav-item"><i class="fa-regular fa-calendar"></i>จองคิวช่าง</button>
                </div>
                <div class="nav-group">
                    <span class="nav-label">ของฉัน</span>
                    <button onclick="navigateTo('screen-favorites')" id="nav-favorites" class="nav-item"><i class="fa-regular fa-heart"></i>รายการโปรด<span id="fav-badge" class="hidden nav-badge">0</span></button>
                    <button onclick="navigateTo('screen-history')" id="nav-history" class="nav-item"><i class="fa-solid fa-clock-rotate-left"></i>ประวัติการสแกน</button>
                    <button onclick="navigateTo('screen-profile')" id="nav-profile" class="nav-item"><i class="fa-regular fa-user"></i>โปรไฟล์และธีมสี</button>
                </div>
                <div class="nav-group">
                    <span class="nav-label">ช่วยเหลือ</span>
                    <button onclick="navigateTo('screen-feedback')" id="nav-feedback" class="nav-item"><i class="fa-regular fa-comment-dots"></i>ติดต่อแอดมิน</button>
                </div>
                <div class="nav-group">
                    <span class="nav-label">ผู้ดูแลระบบ</span>
                    <button onclick="navigateTo('screen-admin')" id="nav-admin" class="nav-item"><i class="fa-solid fa-chart-simple"></i>แดชบอร์ดแอดมิน</button>
                </div>
            </nav>

            <div class="sidebar-footer">
                <div class="user-card">
                    <span class="user-avatar" data-user-initial>U</span>
                    <div class="user-meta">
                        <strong id="sidebar-user-name" data-user-name>ผู้ใช้</strong>
                        <span id="role-badge">สมาชิก</span>
                    </div>
                    <button onclick="handleLogout()" class="icon-btn icon-btn-plain" aria-label="ออกจากระบบ" title="ออกจากระบบ"><i class="fa-solid fa-arrow-right-from-bracket"></i></button>
                </div>
            </div>
        </aside>

        <main id="main-content" class="app-main" tabindex="-1">

            <div data-include="pages/main.html"></div>

            <div data-include="pages/result.html"></div>


            <div data-include="pages/golden.html"></div>

            <div data-include="pages/guide.html"></div>

            <div data-include="pages/favorites.html"></div>

            <div data-include="pages/admin.html"></div>

            <div data-include="pages/feedback.html"></div>

            <div data-include="pages/history.html"></div>

            <div data-include="pages/glasses.html"></div>

            <div data-include="pages/hairstyle.html"></div>

            <div data-include="pages/booking.html"></div>

            <div data-include="pages/profile.html"></div>

        </main>

        <!-- Mobile bottom tab bar (items mirror the sidebar's role-based visibility) -->
        <nav id="tabbar" aria-label="เมนูลัด">
            <button onclick="navigateTo('screen-main')" class="tab-item is-active" data-tab-for="screen-main screen-result"><i class="fa-solid fa-house"></i>หน้าแรก</button>
            <button onclick="navigateTo('screen-hairstyle')" class="tab-item" data-tab-for="screen-hairstyle screen-glasses" data-mirror="nav-hairstyle"><i class="fa-solid fa-scissors"></i>ลองลุค</button>
            <button onclick="navigateTo('screen-booking')" class="tab-item" data-tab-for="screen-booking" data-mirror="nav-booking"><i class="fa-regular fa-calendar"></i>จองคิว</button>
            <button onclick="navigateTo('screen-favorites')" class="tab-item" data-tab-for="screen-favorites screen-history" data-mirror="nav-favorites"><i class="fa-regular fa-heart"></i>ที่บันทึก</button>
            <button onclick="openMobileMenu()" class="tab-item" data-tab-for="screen-guide screen-golden screen-profile screen-admin screen-feedback"><i class="fa-solid fa-bars"></i>เมนู</button>
        </nav>
    </div>

    <div id="toast-container" class="fixed bottom-6 right-4 left-4 sm:left-auto sm:right-6 z-[90] flex flex-col gap-3 items-center sm:items-end" aria-live="polite"></div>

    <script type="module" src="js/boot.js?v=20261114"></script>
</body>
</html>
