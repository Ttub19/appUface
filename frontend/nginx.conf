server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy API calls to the backend container. The trailing slash on
    # proxy_pass strips the "/api" prefix, so a browser request to
    # /api/auth/login reaches the backend as /auth/login.
    location /api/ {
        proxy_pass http://api:8000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # HTML/JS/CSS are plain ES modules with no hashed filenames, so make the
    # browser revalidate them (cheap 304 via ETag) instead of serving a stale
    # copy after a deploy — a stale module breaks the import graph.
    location ~* \.(?:html|js|css)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ =404;
    }
}
