<!-- ============ FEEDBACK / CONTACT ADMIN SCREEN ============ -->
<div id="screen-feedback" class="hidden page !max-w-[880px]">
    <header class="page-header">
        <div>
            <span class="eyebrow">ช่วยเหลือ</span>
            <h2 class="page-title">ติดต่อแอดมิน</h2>
            <p class="page-sub">เจอปัญหา อยากได้ฟีเจอร์ใหม่ หรือมีเรื่องอยากสอบถาม ส่งถึงแอดมินได้ที่นี่ แอดมินจะตอบกลับในหน้านี้</p>
        </div>
    </header>
    <form id="feedback-form" class="card card-pad space-y-4" onsubmit="submitFeedback(event)" novalidate>
        <div class="field">
            <label for="feedback-category" class="field-label">เรื่อง</label>
            <select id="feedback-category" class="select">
                <option value="suggestion">ข้อเสนอแนะ</option>
                <option value="bug">แจ้งปัญหาการใช้งาน</option>
                <option value="contact">ติดต่อแอดมิน</option>
                <option value="other">อื่น ๆ</option>
            </select>
        </div>
        <div class="field">
            <label for="feedback-subject" class="field-label">หัวข้อ</label>
            <input id="feedback-subject" type="text" class="input" maxlength="160" required placeholder="เช่น กดวิเคราะห์ในมือถือแล้วไม่ขึ้นผล">
        </div>
        <div class="field">
            <label for="feedback-message" class="field-label">รายละเอียด</label>
            <textarea id="feedback-message" class="input feedback-textarea" maxlength="2000" required oninput="updateFeedbackCount()" placeholder="เล่าสิ่งที่เกิดขึ้น หรือสิ่งที่อยากให้ปรับปรุง (อย่างน้อย 10 ตัวอักษร)"></textarea>
            <div class="flex justify-between gap-3"><span id="feedback-origin" class="field-hint"></span><span id="feedback-count" class="field-hint tabular-nums">0/2000</span></div>
        </div>
        <div id="feedback-guest-fields" class="hidden grid sm:grid-cols-2 gap-4">
            <div class="field">
                <label for="feedback-name" class="field-label">ชื่อของคุณ</label>
                <input id="feedback-name" type="text" class="input" maxlength="120" autocomplete="name">
            </div>
            <div class="field">
                <label for="feedback-email" class="field-label">อีเมลสำหรับติดต่อกลับ</label>
                <input id="feedback-email" type="email" class="input" maxlength="255" autocomplete="email" placeholder="you@example.com">
            </div>
        </div>
        <div class="flex justify-end">
            <button id="feedback-submit" type="submit" class="btn btn-primary"><i class="fa-regular fa-paper-plane"></i>ส่งถึงแอดมิน</button>
        </div>
    </form>
    <section id="feedback-mine-card" class="hidden card card-pad">
        <h4 class="card-title">ข้อความของฉัน</h4>
        <p class="card-sub">สถานะและคำตอบจากแอดมิน</p>
        <div id="feedback-mine" class="feedback-list mt-4"></div>
    </section>
</div>
